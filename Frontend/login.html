<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - Aethera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=3.9.9">
  <link rel="stylesheet" href="css/components.css?v=3.9.9">
  <link rel="stylesheet" href="css/i18n.css?v=1.0.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFFFFF'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 10;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface, rgba(17, 24, 39, 0.85));
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
      border-radius: 16px;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      text-decoration: none;
      color: var(--text-primary, #f9fafb);
      font-weight: 700;
      font-size: 1.25rem;
    }
    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 1.75rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.6rem 0;
      border: none;
      background: transparent;
      color: var(--text-muted, #9ca3af);
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      background: var(--bg-card, rgba(255, 255, 255, 0.12));
      color: var(--text-primary, #fff);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .auth-form-group {
      margin-bottom: 1.25rem;
    }
    .auth-form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary, #d1d5db);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .auth-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
      border-radius: 8px;
      color: var(--text-primary, #fff);
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--accent-primary, #3b82f6);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .auth-alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .auth-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .auth-alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #86efac;
    }
    .auth-submit-btn {
      width: 100%;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .auth-footer-text {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted, #9ca3af);
    }
    .auth-footer-text a {
      color: var(--accent-primary, #3b82f6);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- 3D Cosmos Background Canvas (Landing Page Background) -->
  <div id="bg-universe" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-overlay-gradient"></div>
  </div>

  <div class="auth-page-container">
    <div class="navbar-lang-slot" id="navbar-lang-slot" style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 20;"></div>
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>Aethera</span>
      </a>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab-btn active" id="tab-login" role="tab" data-i18n="auth.tab_signin">Sign In</button>
        <button type="button" class="auth-tab-btn" id="tab-register" role="tab" data-i18n="auth.tab_register">Create Account</button>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="auth-form" novalidate>
        <div class="auth-form-group">
          <label for="username" data-i18n="auth.username_label">Username</label>
          <input type="text" id="username" class="auth-input" placeholder="e.g. alex99" data-i18n-placeholder="auth.username_placeholder" autocomplete="username" required minlength="3">
        </div>

        <div class="auth-form-group">
          <label for="password" data-i18n="auth.password_label">Password</label>
          <input type="password" id="password" class="auth-input" placeholder="••••••••" data-i18n-placeholder="auth.password_placeholder" autocomplete="current-password" required minlength="6">
        </div>

        <button type="submit" id="auth-submit" class="btn btn-primary auth-submit-btn">
          <span data-i18n="auth.btn_signin">Sign In</span>
        </button>
      </form>

      <div class="auth-footer-text">
        <span id="auth-switch-prompt" data-i18n="auth.prompt_no_account">Need an account?</span>
        <a href="#" id="auth-switch-link" data-i18n="auth.link_register">Create one</a>
      </div>
    </div>
  </div>

  <script src="js/background-engine.js?v=4.1.3"></script>
  <script src="js/user-db.js"></script>
  <script src="js/i18n.js?v=1.0.0"></script>
  <script>
    let mode = 'login';
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const authForm = document.getElementById('auth-form');
    const submitBtn = document.getElementById('auth-submit');
    const alertBox = document.getElementById('auth-alert');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const switchPrompt = document.getElementById('auth-switch-prompt');
    const switchLink = document.getElementById('auth-switch-link');

    const params = new URLSearchParams(window.location.search);
    const redirectUrl = params.get('redirect') || 'index.html';

    function setMode(newMode) {
      mode = newMode;
      alertBox.className = 'auth-alert';
      alertBox.textContent = '';
      const t = (k, fb) => (window.aetheraI18n ? window.aetheraI18n.t(k) || fb : fb);
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submitBtn.innerHTML = `<span data-i18n="auth.btn_signin">${t('auth.btn_signin', 'Sign In')}</span>`;
        passwordInput.autocomplete = 'current-password';
        switchPrompt.textContent = t('auth.prompt_no_account', 'Need an account?');
        switchPrompt.setAttribute('data-i18n', 'auth.prompt_no_account');
        switchLink.textContent = t('auth.link_register', 'Create one');
        switchLink.setAttribute('data-i18n', 'auth.link_register');
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.innerHTML = `<span data-i18n="auth.btn_register">${t('auth.btn_register', 'Create Account')}</span>`;
        passwordInput.autocomplete = 'new-password';
        switchPrompt.textContent = t('auth.prompt_have_account', 'Already have an account?');
        switchPrompt.setAttribute('data-i18n', 'auth.prompt_have_account');
        switchLink.textContent = t('auth.link_signin', 'Sign In');
        switchLink.setAttribute('data-i18n', 'auth.link_signin');
      }
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));
    switchLink.addEventListener('click', (e) => {
      e.preventDefault();
      setMode(mode === 'login' ? 'register' : 'login');
    });

    window.addEventListener('aethera:language-change', () => {
      setMode(mode);
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      const t = (k, fb) => (window.aetheraI18n ? window.aetheraI18n.t(k) || fb : fb);

      if (!username || username.length < 3) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = t('auth.err_user_len', 'Username must be at least 3 characters.');
        return;
      }
      if (!password || password.length < 6) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = t('auth.err_pass_len', 'Password must be at least 6 characters.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>${t('auth.processing', 'Processing...')}</span>`;
      alertBox.className = 'auth-alert';

      try {
        const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        if (window.aetheraDB) {
          window.aetheraDB.setSession(data.token, data.user);
        } else {
          localStorage.setItem('aethera_auth_token', data.token);
          localStorage.setItem('aethera_auth_user', JSON.stringify(data.user));
        }

        alertBox.className = 'auth-alert success';
        alertBox.textContent = mode === 'login' ? t('auth.signed_in_sync', 'Signed in! Syncing data...') : t('auth.registered_loading', 'Account created! Loading...');

        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 600);
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${mode === 'login' ? t('auth.btn_signin', 'Sign In') : t('auth.btn_register', 'Create Account')}</span>`;
      }
    });
  </script>
</body>
</html>
